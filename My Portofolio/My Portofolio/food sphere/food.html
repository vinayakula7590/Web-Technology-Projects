<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodSphere - Food</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ================= HEADER ================= -->

    <header class="navbar">

        <div class="logo">
            🍴 <span>FoodSphere</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#foods">
                Explore Food
            </a>

        </nav>

    </header>


    <!-- ================= FOOD DETAILS ================= -->

    <main class="food-page">

        <!-- Food introduction -->

        <section class="food-hero">

            <div
                id="foodEmoji"
                class="big-food-icon"
            >
                🍽️
            </div>

            <h1 id="foodName">
                Loading food...
            </h1>

            <p id="foodDescription">
                Loading information...
            </p>

        </section>


        <!-- Interesting fact -->

        <section class="fact-section">

            <h2>
                🤔 Interesting Fact
            </h2>

            <p id="foodFact">
                Loading fact...
            </p>

        </section>


        <!-- Nutrition -->

        <section class="nutrition-section">

            <h2>
                🥗 Nutrition Facts
            </h2>

            <div class="nutrition-grid">

                <div class="nutrition-card">

                    <span>🔥</span>

                    <strong>
                        Calories
                    </strong>

                    <p id="calories">
                        --
                    </p>

                </div>


                <div class="nutrition-card">

                    <span>💪</span>

                    <strong>
                        Protein
                    </strong>

                    <p id="protein">
                        --
                    </p>

                </div>


                <div class="nutrition-card">

                    <span>🌾</span>

                    <strong>
                        Carbohydrates
                    </strong>

                    <p id="carbohydrates">
                        --
                    </p>

                </div>


                <div class="nutrition-card">

                    <span>🥑</span>

                    <strong>
                        Fat
                    </strong>

                    <p id="fat">
                        --
                    </p>

                </div>


                <div class="nutrition-card">

                    <span>🌱</span>

                    <strong>
                        Fiber
                    </strong>

                    <p id="fiber">
                        --
                    </p>

                </div>

            </div>

        </section>


        <!-- Ingredients -->

        <section class="ingredients-section">

            <h2>
                🧂 Main Ingredients
            </h2>

            <ul id="ingredients">
            </ul>

        </section>


        <!-- Back button -->

        <div class="back-container">

            <a
                href="index.html"
                class="back-button"
            >
                ← Back to Foods
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
